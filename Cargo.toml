[package]
name = "galaxync"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A resilient mirror daemon for Ansible Galaxy collections"
repository = "https://github.com/psvmcc/galaxync"
homepage = "https://github.com/psvmcc/galaxync"
readme = "README.md"
license = "MIT"
keywords = ["ansible", "galaxy", "mirror", "prometheus"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
bytes = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
http = "1"
httpdate = "1"
humantime = "2"
prometheus-client = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10" }
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
